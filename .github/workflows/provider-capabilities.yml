name: Verify mainnet capabilities
on:
  push:
    branches: [main]
    paths:
      - scripts/probe-capabilities.mjs
      - .github/workflows/provider-capabilities.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provider:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify real mainnet archive and trace access
        run: node scripts/probe-capabilities.mjs
        env:
          ROBINHOOD_MAINNET_RPC: ${{ secrets.ROBINHOOD_MAINNET_RPC }}
      - name: Preserve capability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mainnet-capability-report
          path: CAPABILITY-REPORT.json
