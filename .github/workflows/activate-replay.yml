name: Verify and activate replay
on:
  push:
    branches: [main]
    paths:
      - scripts/discover-cases.mjs
      - .github/workflows/activate-replay.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reversa-production
  cancel-in-progress: false
jobs:
  activate:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run validate
      - name: Confirm archive and trace access
        run: node scripts/probe-capabilities.mjs
        env:
          ROBINHOOD_MAINNET_RPC: ${{ secrets.ROBINHOOD_MAINNET_RPC }}
      - name: Discover representative mainnet cases
        run: node scripts/discover-cases.mjs
        env:
          ROBINHOOD_MAINNET_RPC: ${{ secrets.ROBINHOOD_MAINNET_RPC }}
      - name: Verify complete live scenario matrix
        run: npm run verify:provider
        env:
          ROBINHOOD_MAINNET_RPC: ${{ secrets.ROBINHOOD_MAINNET_RPC }}
      - name: Upload live verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-verification
          path: |
            CAPABILITY-REPORT.json
            PROVIDER-READINESS.json
            verification-cases.json
      - name: Deploy verified replay mode
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: '4.151.1'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --var DEPLOYMENT_MODE:full
          secrets: |
            ROBINHOOD_MAINNET_RPC
        env:
          ROBINHOOD_MAINNET_RPC: ${{ secrets.ROBINHOOD_MAINNET_RPC }}
